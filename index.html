<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동양미래대학교 로봇소프트웨어과</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="#" class="logo">
            <span>DYM ROBOT</span>
        </a>
        <nav>
            <ul>
                <li><a href="#">대학소개</a></li>
                <li><a href="#">입학안내</a></li>
                <li><a href="#">학부·학과</a></li>
                <li><a href="#">게시판</a></li>
            </ul>
        </nav>
        <a href="#" class="login-btn">로그인</a>
    </header>

    <section class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1>Robot Software</h1>
                <div class="hero-info">
                    <div class="info-item">📍 4호관 208호</div>
                    <div class="info-item">📞 02-2610-1832</div>
                    <div class="info-item">✉️ yjyang@dongyang.ac.kr</div>
                </div>
            </div>
            <img src="robot_mascot.png" alt="Mascot" class="mascot-img">
        </div>
    </section>

    <main class="container">
        <div class="main-content">
            <!-- 자유게시판 -->
            <div class="card" id="board-container">
                <div class="section-title">
                    <span>자유게시판</span>
                    <button class="btn-primary" onclick="openModal()">글쓰기</button>
                </div>
                <table class="board-list">
                    <thead>
                        <tr>
                            <th>번호</th>
                            <th>제목</th>
                            <th>작성자</th>
                            <th>날짜</th>
                        </tr>
                    </thead>
                    <tbody id="post-list">
                        <!-- Firestore 데이터가 여기에 표시됩니다 -->
                        <tr>
                            <td colspan="4" style="text-align:center; padding: 50px;">게시글을 불러오는 중...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 게시글 상세 보기 (숨김 처리) -->
            <div class="card" id="post-detail" style="display: none; margin-top: 20px;">
                <div class="section-title">
                    <span id="detail-title">제목</span>
                    <button class="btn-primary" onclick="backToList()" style="background:var(--text-muted)">목록으로</button>
                </div>
                <div id="detail-content" style="padding: 20px; min-height: 200px;">내용</div>
                <div id="detail-meta" style="padding: 10px 20px; font-size: 0.9rem; color: var(--text-muted); border-bottom: 1px solid #eee;">작성자: <span id="detail-author"></span> | 날짜: <span id="detail-date"></span></div>
                
                <div style="padding: 20px; display: flex; gap: 10px;">
                    <button class="btn-primary" id="edit-btn">수정</button>
                    <button class="btn-primary" id="delete-btn" style="background: #e63946;">삭제</button>
                </div>

                <div class="comments-section">
                    <h4>댓글</h4>
                    <div id="comment-list"></div>
                    <div class="form-group" style="margin-top: 20px; display: flex; gap: 10px;">
                        <input type="text" id="comment-input" placeholder="댓글을 입력하세요...">
                        <button class="btn-primary" onclick="addComment()">등록</button>
                    </div>
                </div>
            </div>
        </div>

        <aside class="sidebar">
            <div class="card" style="margin-bottom: 20px;">
                <div class="section-title">학과 공지사항</div>
                <ul style="list-style: none;">
                    <li style="margin-bottom: 10px;"><a href="#" style="text-decoration:none; color:var(--text-main); font-size: 0.9rem;">• 2026학년도 1학기 출석 인정 절차 안내</a></li>
                    <li style="margin-bottom: 10px;"><a href="#" style="text-decoration:none; color:var(--text-main); font-size: 0.9rem;">• 스마트팩토리실무 휴보강 공지</a></li>
                </ul>
            </div>
            <div class="card">
                <div class="section-title">전공동아리</div>
                <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                    <span style="background:var(--primary); color:white; padding: 5px 10px; border-radius: 15px; font-size: 0.8rem;">MAS</span>
                    <span style="background:var(--accent); color:var(--primary); padding: 5px 10px; border-radius: 15px; font-size: 0.8rem;">MCA</span>
                    <span style="background:var(--accent); color:var(--primary); padding: 5px 10px; border-radius: 15px; font-size: 0.8rem;">MoAS</span>
                    <span style="background:var(--accent); color:var(--primary); padding: 5px 10px; border-radius: 15px; font-size: 0.8rem;">SMART</span>
                </div>
            </div>
        </aside>
    </main>

    <!-- 글쓰기 모달 -->
    <div class="modal" id="write-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 20px;">새 글 작성</h2>
            <div class="form-group">
                <label>제목</label>
                <input type="text" id="post-title" placeholder="제목을 입력하세요">
            </div>
            <div class="form-group">
                <label>작성자</label>
                <input type="text" id="post-author" placeholder="닉네임">
            </div>
            <div class="form-group">
                <label>내용</label>
                <textarea id="post-content" placeholder="내용을 입력하세요"></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn-primary" onclick="closeModal()" style="background: var(--text-muted);">취소</button>
                <button class="btn-primary" id="save-btn" onclick="savePost()">저장하기</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
